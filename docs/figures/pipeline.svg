<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 150" width="1080" height="150" role="img" aria-label="Pipeline: Extract claims and queries, Search the top 10 pages excluding the claim's own source, Read each page and assign one of seven flags, Weigh the flags with fitted log-likelihood weights, Decide by comparing the summed log-odds with a boundary.">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8c959f"/></marker></defs>
<rect x="20" y="18" width="172" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="106.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328"><tspan font-size="14" font-weight="500" fill="#59636e">1  </tspan>Extract</text>
<text x="106.0" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">claims + queries</text>
<line x1="198" y1="50.0" x2="231" y2="50.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="237" y="18" width="172" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="323.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328"><tspan font-size="14" font-weight="500" fill="#59636e">2  </tspan>Search</text>
<text x="323.0" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">top 10 pages,</text>
<text x="323.0" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">own source excluded</text>
<line x1="415" y1="50.0" x2="448" y2="50.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="454" y="18" width="172" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="540.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328"><tspan font-size="14" font-weight="500" fill="#59636e">3  </tspan>Read</text>
<text x="540.0" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">one of seven flags</text>
<text x="540.0" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">per page</text>
<line x1="632" y1="50.0" x2="665" y2="50.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="671" y="18" width="172" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="757.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328"><tspan font-size="14" font-weight="500" fill="#59636e">4  </tspan>Weigh</text>
<text x="757.0" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">fitted log-likelihood</text>
<text x="757.0" y="127" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">weights</text>
<line x1="849" y1="50.0" x2="882" y2="50.0" stroke="#8c959f" stroke-width="2" marker-end="url(#ah)"/>
<rect x="888" y="18" width="172" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
<text x="974.0" y="57.0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#1f2328"><tspan font-size="14" font-weight="500" fill="#59636e">5  </tspan>Decide</text>
<text x="974.0" y="108" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#59636e">log-odds vs boundary</text>
</svg>
