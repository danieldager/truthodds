[project]
name = "deepinfra-runner"
version = "0.1.0"
description = "The shared DeepInfra runner: RateGate concurrency control, per-item cache, retries, sweep, spend cap"
requires-python = ">=3.10"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0"]

[project.scripts]
deepinfra-run = "deepinfra_runner.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepinfra_runner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
