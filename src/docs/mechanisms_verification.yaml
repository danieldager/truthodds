  kind: "config"
  where: "verify_tweet_claims.py:91"
  what: "When on, an LLM triage step picks WHICH search hits to read in full and HOW MANY (no cap). When off, a fixed walk of pages_per_round scrapes is kept."
  why: "v5, 2026-07-13, verify_loop_versions Change 3 — the 0..5 read cap was removed; read_target = len(picks)."
  params: "triage_enabled = True"
  failure_modes: "Triage can miss the relevant result (query missed); mitigated by backfill and explicit empty-list handling."

