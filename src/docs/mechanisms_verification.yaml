- id: "query-stopwords"
  name: "Query stopword set"
  kind: "constant"
  where: "verify_tweet_claims.py:56-58 (_QUERY_STOPWORDS)"
  what: "Function words carrying no search signal; a query adding only these has nothing new to look up. Years are deliberately NOT included ('+2026' is a real refinement)."
  why: "v4 Change 0, 2026-07-12, verify_loop_versions — feeds _redundant_query, replacing overlap-coefficient _too_similar which over-escalated supersets to Exa."
  params: "frozenset of ~50 function words (a an the of to ... new); note 'new' IS a stopword"
  failure_modes: "A rewording that only reorders content tokens is flagged redundant even if intent differs."

- id: "redundant-query"
  name: "Redundant-query detector"
  kind: "code-guard"
  where: "verify_tweet_claims.py:66-76 (_redundant_query); _content_tokens:61-63"
  what: "True only when a query introduces NO new content token (>2 chars, non-stopword) beyond all prior queries. A query adding any discriminating term (state, year, name, figure) is a genuine REFINEMENT and runs on Serper."
  why: "v4 Change 0, 2026-07-12 (audit 2026-07-12, verify_eval_roadmap) — the old overlap-coefficient flagged every superset refinement as a dup and over-escalated to Exa."
  params: "content token = lowercased split token, len>2, not in _QUERY_STOPWORDS"
  failure_modes: "Duplicate _content_tokens definition exists (line 61 word-split vs line 222 regex) — the escalation path uses the line-61 split version."

- id: "diversify-query"
  name: "Forced diversified requery"
  kind: "code-guard"
  where: "verify_tweet_claims.py:586-599 (_diversify_query) + REQUERY_SYSTEM"
  what: "When QUERY's proposed query only rewords a prior one, force ONE genuinely-different Serper query fed all prior queries (avoid list). If the model still can't diversify, run it anyway (tries accounting bounds the loop)."
  why: "v4 Change 0 / v5 Change 3 (2026-07-12/13) — a rewording burns the targets' tries; diversify is now per-round, never an early Exa jump on redundancy."
  params: "requery_max_tokens=120; only= restricts to the target subset"
  failure_modes: "If diversified alt is still redundant, the original redundant query runs (bounded by tries)."

# =====================================================================================
# PROMPTS
# =====================================================================================

- id: "prompt-query"
  name: "QUERY system prompt"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:520-522 (QUERY_SYSTEM)"
  what: "Writes ONE new keyword query targeting the most at-risk under-tried open claim(s), folding related claims into 'targets'. Chase what GAP notes point to (primary record, named person/document, date, figure). Must be meaningfully different from every prior query; anchor time-sensitive claims to the post date; 4-10 words, no operators."
  why: "v6, 2026-07-13, verify_loop_versions Change 4 — QUERY absorbs OPEN + STEP's query duty + REQUERY diversify. No evidence windows fed (quote-level detail produced echo-shaped queries)."
  params: 'output {"targets":[ids],"query":str}; open_max_tokens=300'
  failure_modes: "Can aim at exhausted/closed claims -> code reassigns targets to under-tried set (line 921-922)."

- id: "prompt-read-stances"
  name: "READ stance definitions"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:524-539 (READ_SYSTEM)"
  what: "Per-claim page-local stance over numbered sentences [S1].. Five stances judged on the claim's EXACT proposition. supports=affirms every load-bearing part; partially-supports=one conjunct/adjacent/weaker fact; neutral=contextualizes; partially-refutes=contradicts part; refutes=contradicts the exact proposition."
  why: "READ v4 locked 2026-07-10 (v1). Load-bearing-specifics clause added v7 Change 7 (2026-07-15): exact figure/superlative/quoted-words/causal-agency absent -> at most partially-supports (pairs with the exact-stance anchor)."
  params: "stances: supports|partially-supports|neutral|partially-refutes|refutes"
  failure_modes: "Advisory only — RESOLVE re-judges. Stance mislabels persist (audit: MotherJones sarcasm-inversion, 4 stance-misreads)."

- id: "prompt-read-quote-refutation"
  name: "READ quote/attribution refutation rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:531 (READ_SYSTEM, refutes clause)"
  what: "For a quote/attribution claim, refutes REQUIRES this article to contradict the SAYING (a denial, correction, or different verbatim record of the same statement). The quote merely not appearing here is neutral, NOT refutation."
  why: "v7 Change 7, 2026-07-15, verify_loop_versions / clog/150726 — dev-500 audit: quote-refuted-against-wrong-artifact was 4 of 15 wrong refutations."
  params: "n/a"
  failure_modes: "Residual: attribution-axis failures persist in v7 refute audit (clog 09:30)."

- id: "prompt-read-minimal-segs"
  name: "READ minimal-citation rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:533-535 (READ_SYSTEM Rules)"
  what: "Cite the MINIMAL set of sentences carrying the stance; do NOT cite surrounding/topical context (added mechanically later). Prefer contiguous spans; OMIT claims the article is silent on; no paraphrase/quote; no overall-truth judgment."
  why: "v1 pointer design; context is added by resolve_windows so citations stay tight. Enforced by max_segs cap."
  params: "n/a"
  failure_modes: "Whole-article marks happen anyway -> max_segs=8 truncation."

- id: "prompt-read-republication-flag"
  name: "READ republication flag"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:536 (READ_SYSTEM)"
  what: "Set republication=true if the page is substantially the POSTING OUTLET'S OWN reporting relayed (reprint/mirror or restatement without independent reporting). A page disputing the outlet's reporting with its own sources is NOT a republication."
  why: "Daniel 2026-07-10 (v1) — narrow judgment left to READ; code is_republication is deliberately narrow otherwise."
  params: "n/a"
  failure_modes: "Model-reliant; outlet-level commentary and author-level echo networks remain on the backlog (v6 Change 5)."

- id: "prompt-resolve-same-event"
  name: "RESOLVE same-event / as-of-post-date rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:546 (RESOLVE_SYSTEM)"
  what: "Evidence must concern the same event/period as the post (use post date). Off-period evidence neither supports nor refutes; a source published before the claimed event can't confirm it. Refute direction is time-anchored too: schedules, standing conditions, report-existence, trailing-window superlatives are judged AS OF THE POST DATE; PUBLISHED-AFTER-THE-POST evidence describing a later development does not refute what was true when posted."
  why: "Same-event: v2 Change 1 (2026-07-11) from dev50 audit (all 3 hard false flags = temporal misalignment). As-of-post-date refute extension: v7 Change 7 (2026-07-15) — post-date evidence flipping as-of-date claims was the largest wrong-refutation class (5 of 15)."
  params: "paired with _after_post AFTER-POST dossier tags"
  failure_modes: "Recurring-event instance drift persists in v7 refute audit."

- id: "prompt-resolve-attribution"
  name: "RESOLVE attribution rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:547 (RESOLVE_SYSTEM) + t=='attribution' handling"
  what: "For 'X said/claims Y' the proposition is the SAYING, not Y — if credible evidence confirms X said it, supported even if Y is dubious. Applies ONLY to third parties; the posting outlet's OWN assertions are the post, judged on substance, never 'the outlet said it'."
  why: "v3, 2026-07-11, verify_loop_versions — closes the v2 Grayzone loophole where the outlet's own assertion was treated as an attribution to dodge the substitution guard."
  params: "claim type t in {assertion, attribution}"
  failure_modes: "Upstream extraction issue: commentary/attribution posts entering as bare factual claims caused 3/5 false nudges (lowng audit)."

- id: "prompt-resolve-substitution"
  name: "RESOLVE no-weaker-proposition rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:548 (RESOLVE_SYSTEM)"
  what: "supported requires the FULL exact proposition including causal/agency attribution ('under pressure from X', 'because of Y'). Evidence affirming the event but not the attribution does NOT make the claim supported."
  why: "v2 Change 6, 2026-07-11, verify_loop_versions — proposition-substitution guard (6 substitution cases in dev50 audit)."
  params: "n/a"
  failure_modes: "'Laundered specifics' (event confirmed by strong source, load-bearing figure only in origin) still ~7-9% supported contamination after v7."

- id: "prompt-resolve-refuted-requires"
  name: "RESOLVE refuted-requires rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:549 (RESOLVE_SYSTEM)"
  what: "refuted requires credible evidence DIRECTLY contradicting the exact proposition. A slightly different figure, adjacent window, hedged version, or minor label discrepancy is looseness NOT refutation. For attribution, refutation needs evidence about the SAYING (denial/correction/materially-different record); the exact words being absent is NOT refutation, and a same-substance paraphrase supports."
  why: "v3 lowng audit fix + v7 Change 7 quote-absence rule (2026-07-15)."
  params: "n/a"
  failure_modes: "Proposition-fidelity residuals (sarcasm, who-reported-first) persist post-v7."

- id: "prompt-resolve-closure-bar"
  name: "RESOLVE closure-bar statement (mirrors code)"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:556 (RESOLVE_SYSTEM)"
  what: "States the ENFORCED-IN-CODE bar so the model doesn't propose closes that will be refused: supported/refuted needs >=1 READ PRIMARY, or 1 READ RELIABLE NG>=90, or 2 independent reliable voices on distinct domains of which >=1 is READ; a SNIPPET-ONLY entry from PRIMARY/NG>=90 may serve as the 2nd voice but snippets NEVER close alone. UNRATED/UNRELIABLE/republication/opinion (except attribution) don't count."
  why: "v4 Change 1, 2026-07-13 — the counting moved into code (_meets_bar); prompt keeps the semantic work and is told the bar."
  params: "mirrors NG_STRONG=90, NG_RELIABLE=60"
  failure_modes: "Prompt statement can drift from code; code is authoritative (guards refuse regardless)."

- id: "prompt-resolve-independence"
  name: "RESOLVE independence rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:557 (RESOLVE_SYSTEM)"
  what: "A source republishing/mirroring the originating outlet's own reporting is NOT independent corroboration — weigh as the outlet's own voice. Same for ANY shared upstream voice: same wire story, same media group, same press release across domains = ONE voice. Count independent voices, not domains."
  why: "v2 Change 5, 2026-07-11 (syndication-aware independence). Deepened in code by _voice_key/_PUB_FAMILIES v7.2."
  params: "n/a"
  failure_modes: "True author/wire independence is backlog #3; model-side only for cases code can't detect."

- id: "prompt-resolve-snippet"
  name: "RESOLVE snippet rule"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:558 (RESOLVE_SYSTEM)"
  what: "SNIPPET-ONLY entries are search-result excerpts — useful leads/corroboration hints, never sufficient alone; many snippets repeating the same wording across domains are syndication of ONE report, one voice."
  why: "v4 Change 1 snippet amendment, 2026-07-13 — NYT/WSJ-class sources systematically unscrapeable, so snippets must pull weight but never close."
  params: "n/a"
  failure_modes: "Off-topic snippet risk handled in code by _on_topic (v7.2)."

- id: "prompt-resolve-statuses-gap"
  name: "RESOLVE statuses + gap + changed-only output"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:550-561 (RESOLVE_SYSTEM)"
  what: "Five statuses (supported/refuted/conflicting/unsupported/open) with definitions; unsupported requires the claim was TARGETED; a never-targeted claim stays open. For every open claim write a one-line 'gap' (specific missing evidence). Emit a row ONLY for a claim whose status changed OR whose gap is updated — unchanged claims get no row (code keeps state)."
  why: "Changed-only output: v6 Change 6 (2026-07-14, Daniel's latency question) — saves ~20-35 tok/claim/round. Statuses/gap: v6 Change 4."
  params: 'output {"ledger":[{"claim_id","status","gap"}]}; step_max_tokens=3200'
  failure_modes: "conflicting was being used as an escape hatch -> v7.1 conflict bar added in code."

- id: "prompt-resolve-final-note"
  name: "RESOLVE final-round note"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:563 (RESOLVE_FINAL_NOTE); appended when provider==exa"
  what: "On the Exa (final) round, appends 'no further searches will run; any claim you leave open will be recorded as unsupported.'"
  why: "v6 — the Exa round is always the last; the coercion note tells RESOLVE to resolve what it has."
  params: "appended only when final (provider==exa)"
  failure_modes: "Coercion still happens in code regardless (coerced_open)."

- id: "prompt-triage"
  name: "TRIAGE system prompt"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:565-570 (TRIAGE_SYSTEM)"
  what: "Given post + open claims + up to 10 results (id, domain, date, snippet), decide (1) 'read' = ordered priority list of results to full-read (as many as the round needs; prefer primary/reliable; skip same-wire dups and off-claim pages; empty list is valid) and (2) 'snippet_evidence' = results whose snippet already bears on a specific claim."
  why: "v5 Change 3, 2026-07-13 — read cap removed (no min/max), read_target=len(picks). Snippets are free; reading is the expensive step."
  params: 'output {"read":[ids],"snippet_evidence":[{"result","claim_id"}]}; triage_max_tokens=300; sees top-10 ranked'
  failure_modes: "A pick that dies (junk/failed/dup) is silently lost -> backfill mechanism replaces it."

- id: "prompt-exa-query"
  name: "EXA_QUERY system prompt"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:572-580 (EXA_QUERY_SYSTEM)"
  what: "Composes ONE declarative sentence (ending in a colon) for Exa's next-link-prediction — describes the ideal evidence page's ARCHETYPE (primary reporting/official record/court filing/study/fact-check), packing concrete entities/figures/dates/places from open claims. Exact strings (verbatim quotes, rare proper nouns, doc IDs) go in double quotes. No question form, no operators, no keyword lists."
  why: "v1 (folded from verify.py _compose_exa_query); neural engine rewards long content-rich queries. Prior keyword queries failed -> fold their angle as context."
  params: "exa_query_max_tokens=400"
  failure_modes: "Exa mostly chases specifics not on the web (~27% of claims escalate); often adds nothing."

- id: "prompt-requery"
  name: "REQUERY system prompt"
  kind: "prompt-rule"
  where: "verify_tweet_claims.py:582-583 (REQUERY_SYSTEM)"
  what: "One NEW keyword query attacking the open claims from a DIFFERENT ANGLE than every prior query — change entities named, phrasing, or the KIND of source chased (toward primary/official record, named person/document, date, figure). Do NOT add/reorder prior words; anchor time-sensitive claims to post date; 4-10 words."
  why: "v4 Change 0, 2026-07-12 — fires only when QUERY's proposal is redundant, before an Exa jump."
  params: "requery_max_tokens=120"
  failure_modes: "If still redundant, original runs anyway (tries-bounded)."

