- id: "cfg-tries-per-claim"
  name: "Per-claim Serper budget"
  kind: "config"
  where: "verify_tweet_claims.py:88 (PostVerifyConfig.tries_per_claim)"
  what: "Each claim gets this many targeted Serper queries before code marks it unsupported and rotation moves on. A post-level round budget was replaced by this per-claim budget."
  why: "v5, 2026-07-13, verify_loop_versions Change 3 (Daniel's design). Forensics: 6/8 zero-evidence unsupported closes were claims NEVER targeted on 3-8-claim posts; evidence/claim fell ~35% as claims grew under a flat round budget (roundup starvation)."
  params: "tries_per_claim = 2"
  failure_modes: "Worst-case rounds = 2*n_claims+1; low value can starve genuinely-checkable claims. Original-media attribution claims exhaust budget then go unsupported (IDEA-015, structurally unverifiable by search)."

- id: "cfg-triage-enabled"
