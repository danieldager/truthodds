  params: "returns False unconditionally"
  failure_modes: "Dead code; TODO to delete the call sites and function."

- id: "numbered-block"
  name: "Keyword-anchored sentence selection"
  kind: "code-guard"
  where: "read_select.py:80-144 (numbered_block)"
  what: "Renders sentences as '[S<i>] text' capped at cap_tok*4 chars, ORIGINAL indices preserved so citations resolve. Under cap: everything in order. Over cap: SELECT by priority (lede first `lede`=8 sentences but capped at a QUARTER of budget; then keyword-hit sentences richest-first each with +/-`ctx`=2 context; a window that doesn't fit is skipped not stopped), then RENDER in document order with '[...]' for gaps."
  why: "v4 Change 2, 2026-07-13 — head-first truncation lost median 56.6% of body on 18.9% of read docs (a 682k-char congress.gov bill's first 10k chars are the table of contents)."
  params: "cap_chars=cap_tok*4; lede=8 capped at cap_chars//4; ctx=2"
