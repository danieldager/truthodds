# CANDIDATE RANKING
# =====================================================================================

- id: "source-tier-rank"
  name: "Read-ordering source tiers"
  kind: "code-guard"
  where: "verify_tweet_claims.py:182-201 (_source_tier, rank_hits); _ng_of:175-179"
  what: "Stable-sorts hits by quality tier then provider relevance. Tier 0 primary; 1 NG>=75; 2 NG 60-75; 3 unrated; 4 NG<60. Fixes near-dup order-dependence (press release outranks the copy). _ng_of falls back to the registrable parent (news.site.com -> site.com)."
  why: "v1. NB: tier-1 NG>=75 cutoff is READ-ORDERING ONLY; the corroboration gate's single-source cutoff is NG_STRONG=90 — distinct thresholds, don't conflate."
  params: "tiers 0/1/2/3/4; NG cutoffs 75 and 60; sorted() is stable"
  failure_modes: "NG<60 barely reaches the walk because rank_hits buries it (v6 Change 5 census)."

# =====================================================================================
# RELIABILITY TAGGING + CORROBORATION BAR
# =====================================================================================

- id: "const-ng-thresholds"
  name: "NG_STRONG / NG_RELIABLE cutoffs"
  kind: "constant"
  where: "verify_tweet_claims.py:212-213"
  what: "NG_STRONG=90: a single full-read secondary at/above closes a claim alone. NG_RELIABLE=60: reliable-secondary floor; two independent ones close a claim."
  why: "v4 Change 1, 2026-07-13 — NG_STRONG deliberately stricter than rank_hits' NG>=75 read-ordering tier."
  params: "NG_STRONG=90.0; NG_RELIABLE=60.0"
  failure_modes: "US-centric NG coverage starves int'l true claims (fact-checker allowlist + wikipedia added to compensate)."

- id: "rel-info"
  name: "Evidence reliability tagger"
  kind: "code-guard"
  where: "verify_tweet_claims.py:264-280 (_rel_info); _WIKIPEDIA:261"
  what: "Tags each evidence entry PRIMARY / RELIABLE(ng) / UNRATED / UNRELIABLE. Order: primary-source or '.gov/' in URL -> PRIMARY; trusted fact-checker -> RELIABLE at NG_STRONG (single full-read may close, like NG>=90); wikipedia -> RELIABLE (one voice, never single-sufficing); else NG lookup -> RELIABLE if >=60 else UNRELIABLE; no NG -> UNRATED."
  why: "v4 Change 1 (2026-07-13). Wikipedia-as-voice: Daniel 2026-07-13. Fact-checkers as STRONG: Daniel 2026-07-15 ('generally trust fact checkers'; NG map is US-centric — Africa Check/Boom Live were UNRATED and starved true claims), clog/150726 06:40 (1)."
  params: "PRIMARY|RELIABLE(ng)|UNRATED|UNRELIABLE; fact-checker -> NG_STRONG"
  failure_modes: "Claimant-institution echo: a speaker's own .gov/embassy counts PRIMARY for their own claim (NEW hole, AVeriTeC audit clog 05:10, exclusion TBD)."

- id: "trusted-factcheckers"
  name: "Trusted fact-checker allowlist"
  kind: "data-contract"
  where: "credibility.py:22-47 (TRUSTED_FACTCHECKERS, is_trusted_factchecker)"
  what: "~35 IFCN-class fact-checking orgs across 6 continents; a full-read from one counts as a STRONG reliable voice (single full-read may close). Path-suffixed entries (apnews.com/ap-fact-check) are skipped by is_trusted_factchecker (which matches domains, '/' excluded)."
  why: "Daniel 2026-07-15, clog/150726 06:40 (1) — allowlist extended internationally because NewsGuard's coverage map is US-centric."
  params: "snopes/politifact/factcheck.org/fullfact/africacheck/dubawa/boomlive/altnews/correctiv/maldita/chequeado/aap.com.au ... (35)"
  failure_modes: "Path-scoped desks (reuters.com/fact-check) don't match domain-based is_trusted_factchecker — reuters.com matches via _TRUSTED instead."

- id: "is-primary-source"
  name: "Primary-source detector"
  kind: "code-guard"
  where: "credibility.py:113-158 (_GOV_SUFFIXES, _GOV_CC, PRIMARY_SOURCES, is_primary_source)"
  what: "True if a domain PRODUCES the official record. Gov/institutional suffixes (.gov/.mil/.int, .gouv.fr, .gc.ca, .go.jp/kr/th/id/ke, .gob.es/mx/ar, .gub.uy, .govt.nz, .gv.at, .admin.ch) + generic .gov.XX regex + a ~70-domain allowlist (IGOs, stats agencies, central banks, courts, election bodies, legislatures, journals of record). One qualifying primary full-read can close a claim in the gate."
  why: "v4 (2026-07-13 research briefs). .edu/.ac.uk REMOVED from PRIMARY 2026-07-15 (a nd.edu university-blog essay anchored a wrong 'PRIMARY' refutation), clog/150726 06:40 (2)."
  params: "Excluded deliberately: PR wires (fake-release vector), state-actor sites beyond TLD patterns, preprints, aggregators (statista/macrotrends), publisher umbrellas (wiley/mdpi)"
  failure_modes: ".gov.XX also privileges autocracies' official sites (accepted caveat). Claimant-institution echo unresolved."

- id: "qualifying"
  name: "Qualifying-evidence filter"
  kind: "code-guard"
  where: "verify_tweet_claims.py:295-326 (_qualifying); _on_topic:226-229"
  what: "Entries that can count toward closing cid as status: matching claim, not republication-flagged, not opinion (UNLESS the claim is attribution — an op-ed quoting X confirms the saying). Full-reads need a stance in the closing direction. Snippet-only entries qualify ONLY from PRIMARY or NG>=NG_STRONG sources, direction-less, as corroborating voices, and must be ON-TOPIC (share >= SNIPPET_MIN_OVERLAP of claim content tokens)."
  why: "v4 Change 1 (2026-07-13) + snippet amendment + on-topic guard v7.2 (2026-07-15). Measured: 5/503 v7 closes depended on off-topic snippets (dailymotion player chrome, quora) — snippets bind by QUERY TARGETING not content."
  params: "SNIPPET_MIN_OVERLAP=0.15; opinion exempt for t=='attribution'"
  failure_modes: "Snippet stance is unreliable so direction-less — relies on a full-read anchor to carry direction."

- id: "snippet-on-topic"
  name: "Snippet on-topic overlap gate"
  kind: "constant"
  where: "verify_tweet_claims.py:219,222-229 (SNIPPET_MIN_OVERLAP, _content_tokens, _on_topic)"
  what: "A snippet voice must share at least 15% of the claim's content tokens (regex tokens len>3, lowercased) to count. Kills unrelated results and scraped chrome from corroboration."
  why: "v7.2, 2026-07-15, verify_loop_versions Change 8 (Daniel flagged off-topic-snippet risk); measured 5/503 junk closes."
  params: "SNIPPET_MIN_OVERLAP = 0.15; _content_tokens regex [a-z0-9][a-z0-9'-]* len>3"
  failure_modes: "Threshold not tuned at scale; affects ~5-12 closes of 503."

- id: "meets-bar"
  name: "Corroboration bar with exact-stance anchor"
  kind: "code-guard"
  where: "verify_tweet_claims.py:329-371 (_meets_bar)"
  what: "The close bar. Requires (when exact given) >=1 FULL-READ entry with the exact stance ('supports'/'refutes') as anchor. Then passes on: >=1 full-read PRIMARY; OR >=1 full-read secondary NG>=90; OR >=2 independent reliable voices (publishers via _voice_key) on distinct domains of which >=1 is full-read (a high-reliability snippet may fill a non-sole slot). Returns (ok, detail, snippet_domains_counted)."
  why: "Bar locked with Daniel 2026-07-12; snippet amendment 2026-07-13; exact-stance anchor v7 Change 7 (2026-07-15) — 15/23 refutations wrong, many on partially-refutes/adjacent; ~12-15% of supported closes laundered a specific through partially-supports."
  params: "NG_STRONG=90; voices are _voice_key publishers; partials/snippets corroborate but never anchor"
  failure_modes: "Exact-supports anchor discards multi-NG100 partial-consensus on compound claims (~20-25 wrong supported->unsupported flips, v7 fleet audit clog 09:30). Domain-appropriate unrated data sources (Zillow/Redfin/investing.com) orphaned by NG bar."

- id: "pub-families-voice-key"
  name: "Publisher-family voice collapse"
  kind: "data-contract"
  where: "verify_tweet_claims.py:236-254 (_PUB_FAMILIES, _voice_key)"
  what: "Collapses a domain to its publisher VOICE — family membership first (Sun/Scottish Sun/US Sun; Fox subdomains; NYPost/PageSix; Mail family), else the registrable base (news.yahoo.com -> yahoo.com) so subdomains never count as 2 independent voices."
  why: "v7.2, 2026-07-15, verify_loop_versions Change 8 — audit: @TheSun closed on thesun.co.uk + thescottishsun.co.uk as 2 voices (roster lists the US domain so origin-exclusion missed the UK sisters); 7 single-domain '2+ voices' miscounts."
  params: "4 families; base-collapse handles co/com/net/org/ac/gov/go/gob second-level TLDs"
  failure_modes: "Manual family roster — new sister-site clusters need adding; cross-owner shared-wire independence still model-side."

- id: "apply-step-ledger"
  name: "Closure-guard orchestrator"
  kind: "code-guard"
  where: "verify_tweet_claims.py:374-433 (_apply_step_ledger)"
  what: "Applies RESOLVE's proposed ledger through all closure guards, mutating the ledger and returning (guard_events, reopened). Rejects invalid/unknown statuses; emits cid-invalid, cid-coerced, unsupported-untargeted, close-unbacked/close-below-bar, snippet-corroboration, conflict-one-sided events; reopens claims a guard held open so the loop searches again (budget permitting)."
  why: "v4 Change 1, 2026-07-13 — two web-ground-truthed audits showed prose closure rules were gameable (28% of closes rested on unrated blogs as 'independent'); counting moved to code, all pure/replayable."
  params: "valid statuses: supported/refuted/conflicting/unsupported/open"
  failure_modes: "Only records/reopens; the actual pass/fail is _meets_bar. Replay-verified over 238 saved closes (14% refused)."

- id: "unsupported-untargeted"
  name: "Unsupported-requires-targeting guard"
  kind: "code-guard"
  where: "verify_tweet_claims.py:395-401 (_apply_step_ledger)"
  what: "'unsupported' for an open claim is refused unless a query actually targeted it — 'we searched and found nothing' needs a search that targeted it. At the forced conclude (final), an untargeted open claim IS honestly unsupported (allowed)."
  why: "v2 Change 2, 2026-07-11 — dev50 audit had 3 unsearched-claim closes; targeted set updated unconditionally incl. final round."
  params: "guard event 'unsupported-untargeted'; reopens the claim"
  failure_modes: "None recorded; interacts with budget-exhausted coercion which marks targeted-but-empty claims unsupported."

- id: "close-bar-guard"
  name: "Supported/refuted bar enforcement"
  kind: "code-guard"
  where: "verify_tweet_claims.py:403-415 (_apply_step_ledger)"
  what: "On a proposed supported/refuted close (status change), builds qualifying evidence and runs _meets_bar with the exact anchor. If not ok -> emits close-unbacked (no qualifying) or close-below-bar (has qualifying but under bar) and reopens if open. A close using a snippet voice emits snippet-corroboration for audit visibility."
  why: "v4 Change 1, 2026-07-13 — kills empty-evidence attribution closes and zero-contradiction refuted."
  params: "_EXACT_STANCE maps supported->supports, refuted->refutes"
  failure_modes: "Distinct guard names (unbacked vs below-bar) preserved for audit stratification."

- id: "conflict-one-sided"
  name: "Conflicting both-directions bar"
  kind: "code-guard"
  where: "verify_tweet_claims.py:416-431 (_apply_step_ledger)"
  what: "'conflicting' requires at least one FULL-READ qualifying entry in EACH direction (supported and refuted). Otherwise emits conflict-one-sided and reopens. Conflicting is not an escape hatch from the supported/refuted bars."
  why: "v7.1, 2026-07-15, clog/150726 06:40 (5) — AVeriTeC parity smoke: anchor-refused refutations were resettling as conflicting, which previously had NO bar at all."
  params: "needs full-read qualifying in both 'supported' and 'refuted' directions"
  failure_modes: "8-9 of 9 conflicting were still artifacts post-v7 (none dangerous, fleet audit)."

- id: "as-cid"
  name: "Claim/result id coercion"
  kind: "code-guard"
  where: "verify_tweet_claims.py:283-292 (_as_cid)"
  what: "Parses an LLM-JSON id as int or numeric string ('3'->3), validated 1..n; rejects bools. Used for claim ids, targets, read ids, snippet result/claim ids across QUERY/READ/TRIAGE/RESOLVE."
  why: "v4 Change 1, 2026-07-13 — post-50 audit bug: isinstance(int) alone silently dropped string-typed ids, disabling the targeting guard."
  params: "accepts int or digit-string in [1,n]; bool -> None"
  failure_modes: "Out-of-range or non-numeric ids dropped (emits cid-invalid in RESOLVE path)."

# =====================================================================================
# CIRCULARITY / REPUBLICATION / SYNDICATION
# =====================================================================================

- id: "reprint-regex"
  name: "Reprint-phrase detector"
  kind: "regex"
  where: "verify_tweet_claims.py:440-441 (_REPRINT); used in is_republication"
  what: "Matches explicit reprint phrases (originally published/appeared, republished from, reprinted from, cross-posted from, this article was/is from, courtesy of) within the first 5000 chars, requiring an origin-token in the neighborhood."
  why: "v1 circularity guard; deliberately narrow (Daniel 2026-07-10) — a mere mention must not trip it."
  params: "scanned in text[:5000]; neighborhood window [start-100, end+150]"
  failure_modes: "Narrow by design; broad detection is READ's republication flag."

- id: "wire-byline"
  name: "Wire-agency byline republication"
  kind: "regex"
  where: "verify_tweet_claims.py:444-449 (_WIRE_BYLINE); is_republication:489-490"
  what: "When the POSTING outlet is a wire agency (AP/Reuters/AFP), its wire copy on other domains is its own voice — detected by byline patterns ('(AP)', 'by X, Associated Press', '(Reuters)', '(AFP)', 'Agence France-Presse') in the first 2000 chars."
  why: "v2 Change 5, 2026-07-11 — syndication-aware independence for wire-agency posting outlets."
  params: "keyed by origin_domain in {apnews.com, reuters.com, afp.com}; text[:2000]"
  failure_modes: "Only fires when the POSTING outlet is the wire agency; a third outlet running the same wire isn't caught here (model-side)."

- id: "synd-hosts"
  name: "Syndication-host self-copy detector"
  kind: "data-contract"
  where: "verify_tweet_claims.py:474-479,492-493 (_SYND_HOSTS, _is_synd_host, is_republication)"
  what: "A page on a syndication host that names the origin outlet early (first 2500 chars) is the origin's own copy, not independent corroboration."
  why: "v7 Change 7, 2026-07-15 — audit: HuffPost->yahoo and Fox->yahoo closed 'supported' on their own syndicated articles; syndication defeats origin-exclusion in ~5 cases."
  params: "_SYND_HOSTS = yahoo.com, msn.com, aol.com, archive.ph/today/is, ground.news; origin tokens in text[:2500]"
  failure_modes: "Requires origin tokens to appear early; a re-headlined syndication without the outlet name early is missed."

- id: "origin-tokens"
  name: "Origin-outlet name tokens"
  kind: "code-guard"
  where: "verify_tweet_claims.py:458-468 (origin_tokens)"
  what: "Derives name tokens identifying the posting outlet from its domain and handle (thegrayzone.com -> 'grayzone'), stripping TLDs, www/the prefixes, and news/media/official suffixes; tokens must be >=5 chars."
  why: "v1 circularity — drives is_republication and snippet-mention flags."
  params: ">=5 char core token; TLD strip (com/org/net/news/co/io/us/uk); handle strips @, 'the', news/media/official"
  failure_modes: "Short outlet names (<5 chars) produce no token -> republication can't fire on them."

- id: "near-dup-shingles"
  name: "Near-duplicate shingle detector"
  kind: "code-guard"
  where: "verify_tweet_claims.py:504-513 (_shingles, near_dup)"
  what: "8-word shingles over the first 5000 chars; near_dup true when intersection/min(sizes) >= threshold. Drops pages that duplicate one already in the pool. Snippet-level dedupe uses 5-word shingles at threshold 0.6."
  why: "v1 (full-doc 0.5); snippet dedupe added with triage/snippet fallback."
  params: "full doc: n=8, span=5000, thresh=0.5; snippets: n=5, thresh=0.6"
  failure_modes: "Threshold-based; heavy rewrites of the same wire escape (voice-counting catches some at the bar)."

# =====================================================================================
# EVIDENCE MACHINERY
# =====================================================================================

- id: "resolve-windows"
  name: "Pointer-to-window resolver"
  kind: "code-guard"
  where: "verify_tweet_claims.py:605-623 (resolve_windows)"
  what: "Turns READ's cited sentence indices into merged +/-ctx text windows; cited sentences wrapped <<...>>, adjacent windows merged, gaps joined with ' [...] '. Code does resolution — models never see or emit bare sentence text (pointer invariant)."
  why: "v1; pointer invariant (Daniel 2026-07-14, verify_tweet_claims.py:26-30) — models output pointers, code dereferences."
  params: "ctx=ctx_window=3; indices clamped 1..len(sents)"
  failure_modes: "Out-of-range segs silently dropped; empty result skipped."

- id: "after-post-tag"
  name: "PUBLISHED-AFTER-THE-POST tagger"
  kind: "code-guard"
  where: "verify_tweet_claims.py:678-687 (_after_post, _ISO_DATE); _entry_line:690-704"
  what: "Flags an evidence entry whose ISO publication date is strictly after the post's date; surfaced in the dossier line as 'PUBLISHED AFTER THE POST' so RESOLVE applies the as-of-post-date refute rule."
  why: "v7 Change 7, 2026-07-15 — post-dated evidence flipping as-of-date claims was the largest wrong-refutation class."
  params: "ISO YYYY-MM-DD compare (first 10 chars); both must parse"
  failure_modes: "Non-ISO or unknown dates never tag (compare returns False) — a real post-date source with a fuzzy date isn't flagged."

- id: "diet"
  name: "Direction-aware dossier diet"
  kind: "code-guard"
  where: "verify_tweet_claims.py:707-722 (_diet)"
  what: "Per-claim prompt cap: ALL refute-direction entries always kept (safety-critical, hardest to lose); remaining slots to full-reads over snippets, higher reliability first; a snippet superseded by a full read of the same domain is dropped outright. Renders in original round order."
  why: "v6 Change 4, 2026-07-13 (ledger study) — refutation content is easiest to lose (the +/-2 study); guards still count over the FULL list."
  params: "cap k=dossier_entries_cap=5; _REL_RANK PRIMARY<RELIABLE<UNRATED<UNRELIABLE"
  failure_modes: "Prompt-only; RESOLVE may not see a support snippet that guards still count."

- id: "claim-dossiers"
  name: "Dossier builder with freeze + re-expand"
  kind: "code-guard"
  where: "verify_tweet_claims.py:732-768 (claim_dossiers); _bar_line:725-729"
  what: "Per-claim blocks for RESOLVE. Open claims expanded (header with tried n/2, a dry-run bar check in both directions, dieted evidence, prior gap). Closed claims FROZEN to a one-line resolution UNLESS contrary-direction evidence arrived after the close (then re-expanded and marked 'NEW CONTRARY EVIDENCE — re-judge'). Contrary = refute-dir for supported, support-dir for refuted, either for unsupported/conflicting."
  why: "v6 Change 4, 2026-07-13 — re-judging closed claims changed the outcome only 1/50 posts, so freeze unless contrary evidence lands (measured freeze risk 1/50)."
  params: "_FINAL_STATUSES = supported/refuted/conflicting/unsupported; contrary keyed on close_round"
  failure_modes: "A closed claim never re-opens without new contrary-direction evidence entering the pool."

- id: "evidence-table-dedupe"
  name: "Render-side snippet supersession"
  kind: "code-guard"
  where: "verify_tweet_claims.py:639-664 (evidence_table)"
  what: "In the evidence render, a snippet whose (domain, claim) was later READ in full is dropped (superseded by the full-read window) — 95% of measured near-dup clutter. Prompt diet only; guards keep counting over the full list."
  why: "v5 Change 3, 2026-07-13 (forensics) — reduces dup clutter; _meets_bar's distinct-domain logic already collapses these."
  params: "supersede on (domain, claim_id) full-read match"
  failure_modes: "evidence_table is the legacy render; the live dossier path uses _entry_line/_diet."

- id: "rel-tag-render"
  name: "Reliability tag renderer"
  kind: "code-guard"
  where: "verify_tweet_claims.py:626-636 (_rel_tag)"
  what: "Renders an entry's tag for the evidence table: RELIABLE(NG=n), UNRELIABLE(NG<60), PRIMARY, plus '| OPINION piece'. Empty for entries predating tagging (old records replayed)."
  why: "v4 Change 1 metadata surfacing (2026-07-13) — STEP/RESOLVE told the tags."
  params: "shows NG value when known"
  failure_modes: "Old run records replayed through newer code show blank tags."

# =====================================================================================
# CODE VERDICT
# =====================================================================================

- id: "code-verdict"
  name: "Code post-verdict rule"
  kind: "code-guard"
  where: "verify_tweet_claims.py:784-815 (code_verdict)"
  what: "The post verdict is a CODE RULE over claim labels — no verdict LLM call. nudge iff refuted count >= nudge_min_refuted. misinfo_type: FALSE if any refuted, else CONFLICTING, else UNSUPPORTED, else NONE. Justification assembled from refuted claims' resolution lines (traceable to domains); veracity is None (scale retired in v6). Counts ship in the record for offline tuning."
  why: "v6 Change 4, 2026-07-13 (Daniel: 'if we have the verdicts for the claims, we don't really need a verdict step')."
  params: "nudge_min_refuted=1; conflicting/unsupported thresholds TBD; rule string 'code-v6'"
  failure_modes: "Misleading-framing consciously NOT covered (claim labels can't see framing) — parked. Conflicting/unsupported concentration thresholds unset."

# =====================================================================================
# THE LOOP — control flow, budget, gauntlet
# =====================================================================================

- id: "round-backstop"
  name: "Hard round backstop"
  kind: "code-guard"
  where: "verify_tweet_claims.py:898-901 (verify_post loop)"
  what: "An unreachable-in-theory hard cap on rounds; if hit, logs a warning and concludes with stopped='backstop'."
  why: "v5/v6 — safety net given the tries accounting already bounds the loop (2*n+3)."
  params: "rnd > 2*n_claims + 3"
  failure_modes: "Should never fire (tries accounting bounds); a bug that fails to spend tries could."

- id: "under-tried-routing"
  name: "Under-budget routing"
  kind: "code-guard"
  where: "verify_tweet_claims.py:902-970 (verify_post loop)"
  what: "CODE routing: while any open claim is under tries_per_claim -> QUERY (Serper); else if Exa enabled and not done and any unresolved -> ONE Exa round for all unresolved (open+unsupported); else conclude. No LLM conclude decision exists (v6)."
  why: "v6 Change 4, 2026-07-13 — routing moved to code; conclude decision + override obsolete."
  params: "under = open AND tries<2; unresolved = open OR unsupported"
  failure_modes: "None recorded; Exa is exactly one round."

- id: "query-target-fallback"
  name: "QUERY target reassignment + claim-head fallback"
  kind: "code-guard"
  where: "verify_tweet_claims.py:918-935 (verify_post loop)"
  what: "If QUERY's returned targets aren't under-tried opens, charge the whole under set. If QUERY returns no query, fall back to the first 8 words of the top target's claim text. If the query is redundant vs priors, attempt one diversified query."
  why: "v5/v6 — a query aimed at exhausted/closed claims must still spend a real under-tried try; empty output must not stall."
  params: "claim-head = first 8 words; each targeted query increments tries for its targets"
  failure_modes: "Claim-head fallback logged as a warning; rarely hit."

- id: "exa-single-round"
  name: "One Exa escalation for all unresolved"
  kind: "code-guard"
  where: "verify_tweet_claims.py:944-965,1130,1185-1187 (verify_post loop)"
  what: "Exactly ONE Exa round targets all unresolved claims (open+unsupported) once Serper budget is spent; RESOLVE may flip a budget-unsupported claim if neural evidence lands. The Exa round is always final (stopped='exa-final'); RESOLVE gets the FINAL_NOTE."
  why: "v5 Change 3, 2026-07-13 — one neural escalation; Exa never fires early on redundancy."
  params: "exa_k=5; provider='exa'; final=True"
  failure_modes: "Exa failure -> hits=[] -> concludes on current evidence (logged)."

- id: "budget-exhausted-coercion"
  name: "Budget-exhausted -> unsupported"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1153-1161 (verify_post loop)"
  what: "After a non-Exa round, any still-open claim that has spent its tries is code-marked unsupported (honest — it WAS targeted that many times) with a budget-exhausted guard event. The final Exa round still gets one shot at every unresolved claim."
  why: "v5 Change 3, 2026-07-13 — per-claim budget; rotation moves on."
  params: "condition: open AND tries>=tries_per_claim; only on non-Exa rounds"
  failure_modes: "Conflates 'nobody corroborates' with 'structurally unverifiable by search' (IDEA-015 bookkeeping gap)."

- id: "final-coercion"
  name: "Final open-claim coercion"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1188-1193 (verify_post)"
  what: "After the loop, any claim still 'open' is coerced to unsupported and recorded in coerced_open, with a default resolution 'never resolved within budget (coerced)' — so analysis can distinguish 'no evidence exists' from 'we stopped looking'."
  why: "v5/v6 — safety: no opens in the final ledger; coerced_open surfaced (OQ6 interaction)."
  params: "coerced_open list persisted in the record"
  failure_modes: "Coerced unsupported looks like targeted unsupported unless coerced_open is consulted."

- id: "resolution-oneliners"
  name: "Close-time resolution one-liners"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1162-1176 (verify_post)"
  what: "At close time, records a one-line resolution per claim (from the bar detail for supported/refuted, a fixed line for conflicting, a tries-count line for unsupported), sets resolution_status and close_round. These freeze the dossier and feed the verdict justification."
  why: "v6 Change 4, 2026-07-13 — resolutions traceable to domains; freeze dossiers."
  params: "close_round[cid]=rnd; resolutions[cid] text"
  failure_modes: "None recorded."

- id: "gap-notes-briefing"
  name: "Gap-note carryover"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1147-1152 (verify_post)"
  what: "For each claim RESOLVE leaves open with a non-empty gap, store the gap (trimmed to 200 chars) to brief the next QUERY."
  why: "v6 Change 4 — RESOLVE's per-claim 'what's missing' notes drive the next query."
  params: "gap trimmed to 200 chars"
