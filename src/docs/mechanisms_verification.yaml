- id: "clean-text"
  name: "Scrape-text cleaner"
  kind: "code-guard"
  where: "verify_tweet_claims.py:126-147 (clean_text, _UNI, _BOILER)"
  what: "Normalizes smart quotes/dashes/nbsp, NFKC-normalizes, strips boilerplate lines (sign up/subscribe/read more/share/advertisement...), drops short non-terminated lines (<25 chars), and dedupes identical lines."
  why: "v1 preprocessing; scrapes repeat chrome and boilerplate."
  params: "_BOILER regex (~15 phrases, case-insensitive); line drop if len<25 and no terminal punctuation"
  failure_modes: "A legitimate short sentence without terminal punctuation can be dropped."

- id: "sentences-split-dedup"
  name: "Sentence split + dedupe"
  kind: "regex"
  where: "verify_tweet_claims.py:131,150-160 (_SENT, sentences)"
  what: "Splits on sentence-final punctuation followed by capital/quote/digit; sentence-level dedupe by normalized lowercase key (scrapes repeat content — 59 dups measured)."
  why: "v1; scrape audit noted repeated content."
  params: '_SENT = (?<=[.!?"])\\s+(?=[A-Z"\\x27\\d(])'
  failure_modes: "Abbreviations/decimals can mis-split; dedupe key is lossy (case+whitespace normalized)."

