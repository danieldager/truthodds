  kind: "code-guard"
  where: "verify_tweet_claims.py:1040-1045 (verify_post gauntlet)"
  what: "Drops candidates already seen (dup-url), over the domain cap (dup-domain), or whose domain contains the origin string (origin) — every drop logged with a reason."
  why: "v2 Change 3, 2026-07-11 — evidence-loss hardening: silent losses shrank rounds to single-voice closes with no trace."
  params: "reasons: dup-url, dup-domain, origin"
  failure_modes: "Origin match is substring-in-domain; also enforced at search via exclude_domains."

- id: "gauntlet-scrape-floors"
  name: "Scrape length floors (400-char / 4-sentence)"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1047-1082 (verify_post gauntlet)"
  what: "A scraped page <=400 chars is scrape-failed/too-short; a page with <4 sentences after cleaning is too-thin (headline/video stubs). Both floors are KEPT; the failed/short/thin text falls through to a snippet-only fallback entry rather than vanishing."
  why: "v6 Change 5, 2026-07-13 — 400-char is the full-READ bar (aligned with search.THIN_TEXT_CHARS); 4-sentence floor drops 1/100 posts."
  params: "len(txt)<=400 -> too-short; len(sents)<4 -> too-thin"
  failure_modes: "Short real articles survive as snippets (guards forbid snippet-alone closes)."

- id: "gauntlet-junk-offtopic"
  name: "Junk-page + off-topic drops"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1061-1066 (verify_post gauntlet); _JUNK:452-455"
  what: "A page matching junk phrases (bot-block/paywall/error/consent) in its first 600 chars AND lacking >=3 distinct claim terms is dropped junk-page. off-topic (is_off_topic) is DISABLED (always False)."
  why: "v4 Change 2, 2026-07-13 — content-aware junk gate (8/8 gate-eligible junk drops were .gov false positives; a cosmetic JS banner killed full congress.gov bills). off-topic REJECTED by Daniel 2026-07-13 — relevance is TRIAGE's job."
  params: "_JUNK ~14 phrases in cleaned[:600]; SUBSTANCE_HITS=3; off-topic always False"
  failure_modes: "is_off_topic is dead code kept only so call sites import (TODO to delete)."

- id: "gauntlet-near-dup"
  name: "In-pool near-dup drop"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1071-1075 (verify_post gauntlet)"
  what: "Drops a page that is a near-dup (8-word shingle overlap >=0.5) of any doc already in this round OR any doc in the accumulated pool_shingles."
  why: "v1 near-dup guard extended pool-wide."
  params: "near_dup thresh 0.5; pool_shingles accumulates across rounds"
  failure_modes: "Heavy rewrites escape shingle matching."

- id: "snippet-fallback-admission"
  name: "Permissive snippet fallback"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1050-1056,1088-1106 (verify_post)"
  what: "Scrape-failed/too-short/too-thin candidates enter the pool as SNIPPET-ONLY entries (short page text or SERP snippet, capped 400 chars, auto_snippet flag) bound to the query's OPEN targets — same dedupe/circularity treatment. Scrape failures stop being silent; guards forbid snippet-alone closes."
  why: "v6 Change 5, 2026-07-13 (Daniel: 'permissive admission, strict counting') — recovers the vanishing-pick class (5/34 failed picks vanished, incl. a PRIMARY ukraineoversight.gov)."
  params: "fb text capped 400 chars; bound to open query_targets; src R{rnd}.f{n}"
  failure_modes: "Snippet stance is 'snippet' (direction-less); can only corroborate, never anchor/close."

- id: "triage-backfill"
  name: "Triage pick backfill"
  kind: "code-guard"
  where: "verify_tweet_claims.py:994-1003 (verify_post)"
  what: "When a triage pick dies (junk/failed-scrape/dup), the next ranked non-picked hit fills its read slot instead of the round silently shrinking. Provenance (pick/backfill/rank) travels with each hit. An explicit empty triage 'read' list is trusted (read nothing)."
  why: "v2 Change 3, 2026-07-11 — backfill fired invisibly in 68/176 audited rounds; an untriaged hit taking a pick's slot was invisible in the trace."
  params: "walk = picks first, then backfill hits; read_target=len(picks)"
  failure_modes: "None recorded; provenance persisted in the round record."

- id: "snippet-evidence-dedupe"
  name: "Triage snippet-evidence circularity"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1004-1027 (verify_post)"
  what: "For each triage snippet_evidence pick: dedupe near-identical snippets across domains (5-word shingles, thresh 0.6 = one voice), flag republication if a snippet contains an origin token, tag rel/ng/opinion, and namespace the src by round (R{rnd}.{ri}) to avoid cross-round id collisions."
  why: "v4 Change 1 (R-ids namespaced per round, bare R2 collided) + snippet circularity (mirrors share ledes)."
  params: "shingle n=5 thresh 0.6; src R{rnd}.{ri}; snippet_only=True"
  failure_modes: "Snippet dedupe is per-round-scoped seen list."

- id: "parallel-read"
  name: "Parallel READ calls"
  kind: "code-guard"
  where: "verify_tweet_claims.py:1107-1128 (verify_post, asyncio.gather)"
  what: "READ calls run concurrently (asyncio.gather; the LLM pool semaphore governs actual concurrency), then resolve pointers into the shared evidence pool in doc order."
  why: "v6 Change 6, 2026-07-14 (Daniel's latency question) — with the triage cap removed a 5-doc serial round cost ~60s; the dominant per-round latency win."
  params: "concurrency bounded by llm_pool_size=150"
  failure_modes: "None recorded; results applied deterministically in doc order."

